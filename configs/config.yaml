# Configuration for Hiver Support AI
# Phase 2: Data Engineering & Analytics

# Brand Selection
brand:
  selected_brand: "AmazonHelp"
  brand_handle: "@AmazonHelp"

# Data Paths
paths:
  raw_data: "data/raw/twitter_support.csv"
  processed_dir: "data/processed"
  interim_dir: "data/interim"
  exports:
    processed_conversations: "data/processed/processed_conversations.csv"
    annotation_ready: "data/processed/annotation_ready.csv"
    preprocessing_summary: "data/processed/preprocessing_summary.json"
    export_annotation_file: true

# Thread Reconstruction
threads:
  minimum_thread_length: 2
  max_thread_depth: 20

# Text Preprocessing
preprocessing:
  lowercase: false
  remove_urls: true
  normalize_whitespace: true
  preserve_emojis: true
  preserve_punctuation: true
  remove_rt_prefix: true
  strip_mentions_from_start: true

# Quality Filters
quality:
  min_text_length: 3
  remove_duplicates: true
  remove_empty: true
  remove_system_messages: true

# Logging
logging:
  level: "INFO"
  show_progress_bars: true
  log_file: "results/pipeline.log"

# ═══════════════════════════════════════════════
# Phase 2.2: EDA & Brand Intelligence
# ═══════════════════════════════════════════════

analysis:
  eda_output_dir: "results/eda"
  top_n_keywords: 30
  top_n_phrases: 20
  n_clusters: 8
  min_cluster_size: 5
  sample_messages_per_cluster: 5
  escalation_keywords:
    payment:
      - "refund"
      - "charge"
      - "payment"
      - "money"
      - "billing"
      - "charged"
      - "credit"
      - "debit"
      - "transaction"
      - "price"
    account:
      - "account"
      - "login"
      - "password"
      - "locked"
      - "hacked"
      - "access"
      - "verify"
      - "security"
      - "unauthorized"
    damage:
      - "broken"
      - "damaged"
      - "defective"
      - "wrong item"
      - "missing"
      - "not working"
      - "faulty"
      - "cracked"
    urgency:
      - "urgent"
      - "asap"
      - "immediately"
      - "escalate"
      - "supervisor"
      - "manager"
      - "unacceptable"
      - "worst"
      - "terrible"
      - "lawsuit"
  visualization:
    figure_dpi: 150
    figure_format: "png"
    color_palette:
      primary: "#1976D2"
      secondary: "#FF7043"
      accent: "#4CAF50"
      warning: "#FFC107"
      danger: "#F44336"
      neutral: "#78909C"
      background: "#FAFAFA"
      grid: "#E0E0E0"

# ═══════════════════════════════════════════════
# Phase 4: AI Support Agent Engine
# ═══════════════════════════════════════════════

agent:
  classifier:
    model_type: "tfidf_logistic_regression"
    golden_dataset_path: "data/golden/golden_dataset.csv"
    ngram_range: [1, 2]
    max_features: 5000
    c_val: 1.0

  retrieval:
    embedding_model: "all-MiniLM-L6-v2"
    top_k: 3
    index_source: "data/processed/annotation_ready.csv"

  reply_generator:
    llm_provider: "template"  # Options: openai, gemini, template
    model_name: "gpt-4o-mini"
    api_key_env: "OPENAI_API_KEY"
    max_tokens: 250
    temperature: 0.3

  escalation:
    confidence_threshold: 0.65
    auto_escalate_intents:
      - "account_access"
      - "billing_issue"
    trigger_keywords:
      payment_dispute: ["chargeback", "fraud", "unauthorized charge", "lawsuit", "attorney"]
      account_security: ["hacked", "stolen account", "security breach", "locked out"]
      damaged_product: ["cracked screen", "shattered", "broken beyond repair"]
      legal_privacy: ["lawyer", "legal action", "gdpr", "subpoena"]
